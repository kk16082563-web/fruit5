
<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Fruity AI - Fruit Recognition</title>

<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@latest/dist/tf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@latest/dist/teachablemachine-image.min.js"></script>

<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  font-family: 'Kanit', sans-serif;
  background: linear-gradient(135deg,#eaf6ff,#d5eaff);
  min-height: 100vh;
  padding: 30px 15px;
  color: #426d91;
}

.container {
  max-width: 760px;
  margin: auto;
}

header {
  text-align: center;
  margin-bottom: 30px;
}

.logo {
  font-size: 48px;
  font-weight: 800;
  color: #368bd0;
}

.subtitle {
  color: #83a8c7;
  font-size: 14px;
}

.decor {
  font-size: 27px;
  margin-top: 15px;
  letter-spacing: 12px;
}

.card {
  background: white;
  border-radius: 26px;
  padding: 28px;
  margin-bottom: 22px;
  box-shadow: 0 12px 35px #6ba6d51c;
}

h2 {
  color: #368bd0;
  font-size: 21px;
  margin-bottom: 18px;
}

.upload-area {
  background: #f4faff;
  border: 2px dashed #9bcdf2;
  border-radius: 22px;
  min-height: 220px;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  text-align: center;
  cursor: pointer;
  padding: 25px;
  transition: .2s;
}

.upload-area:hover,
.upload-area.drag {
  background: #e8f5ff;
  border-color: #398edb;
}

.upload-icon {
  font-size: 52px;
  margin-bottom: 12px;
}

.upload-area strong {
  color: #438dc9;
  font-size: 17px;
}

.upload-area p {
  color: #92abc1;
  font-size: 13px;
  margin-top: 7px;
}

#imageInput {
  display: none;
}

.preview-box {
  display: none;
  margin-top: 20px;
  padding: 12px;
  background: #f1f8ff;
  border-radius: 18px;
  text-align: center;
}

#preview {
  max-width: 100%;
  max-height: 330px;
  object-fit: contain;
  border-radius: 12px;
}

.file-info {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
  margin-top: 10px;
  font-size: 12px;
  color: #7b9fbd;
  overflow-wrap: anywhere;
}

.remove {
  border: none;
  padding: 7px 12px;
  border-radius: 9px;
  background: #fff0f2;
  color: #d66d82;
  cursor: pointer;
  font-family: inherit;
}

.analyze {
  width: 100%;
  margin-top: 20px;
  padding: 16px;
  border: none;
  border-radius: 16px;
  color: white;
  background: linear-gradient(100deg,#52b1ed,#3587d7);
  font-family: inherit;
  font-size: 17px;
  font-weight: 600;
  cursor: pointer;
  box-shadow: 0 7px 18px #4999d633;
}

.analyze:disabled {
  opacity: .55;
  cursor: not-allowed;
}

#status {
  text-align: center;
  color: #87a9c4;
  font-size: 13px;
  margin-top: 15px;
  min-height: 22px;
}

#results {
  display: none;
}

.best-result {
  background: linear-gradient(135deg,#eaf6ff,#dff0ff);
  border-radius: 22px;
  padding: 25px;
  text-align: center;
  margin-bottom: 25px;
}

.best-icon {
  font-size: 55px;
}

.best-result p {
  color: #83a8c7;
  font-size: 14px;
}

.best-result h3 {
  font-size: 30px;
  color: #3288ce;
  margin: 5px 0;
  overflow-wrap: anywhere;
}

.percent {
  font-size: 38px;
  font-weight: 700;
  color: #348bd1;
}

.result-item {
  padding: 15px;
  background: #f6faff;
  border-radius: 14px;
  margin-bottom: 12px;
}

.result-name {
  display: flex;
  justify-content: space-between;
  gap: 10px;
  color: #527a9c;
  font-size: 14px;
  margin-bottom: 9px;
}

.result-name span {
  overflow-wrap: anywhere;
}

.bar-bg {
  height: 10px;
  background: #e0eef9;
  border-radius: 20px;
  overflow: hidden;
}

.bar {
  height: 100%;
  background: linear-gradient(90deg,#8bd5f5,#398edb);
  border-radius: 20px;
}

footer {
  text-align: center;
  color: #8baac5;
  font-size: 13px;
  margin-top: 25px;
}

@media(max-width:500px) {
  body { padding: 18px 12px; }
  .card { padding: 19px; }
  .logo { font-size: 39px; }
  .upload-area { min-height: 200px; }
}
</style>
</head>

<body>

<div class="container">

<header>
  <div class="logo">🫐 Fruity AI</div>
  <p class="subtitle">
    ค้นพบผลไม้ด้วยเทคโนโลยีปัญญาประดิษฐ์
  </p>
  <div class="decor">🍓 🍇 🍒 🫐 🍑</div>
</header>

<div class="card">

  <h2>📸 อัปโหลดรูปภาพผลไม้</h2>

  <label class="upload-area" id="dropArea" for="imageInput">
    <div class="upload-icon">🖼️</div>
    <strong>เลือกรูปภาพของคุณ</strong>
    <p>ลากรูปภาพมาวางที่นี่ หรือกดเพื่อเลือกไฟล์</p>
    <p>รองรับ JPG, PNG และ WEBP</p>
  </label>

  <input
    type="file"
    id="imageInput"
    accept="image/jpeg,image/png,image/webp"
  >

  <div class="preview-box" id="previewBox">
    <img id="preview" alt="ภาพผลไม้">

    <div class="file-info">
      <span id="fileName"></span>
      <button class="remove" id="removeBtn" type="button">
        ✕ ลบภาพ
      </button>
    </div>
  </div>

  <button class="analyze" id="analyzeBtn" disabled>
    ✨ วิเคราะห์ผลไม้
  </button>

  <p id="status">
    กรุณาเลือกรูปภาพที่ต้องการวิเคราะห์ 💙
  </p>

</div>

<div class="card" id="results">

  <h2>💎 ผลการวิเคราะห์</h2>

  <div class="best-result">
    <div class="best-icon" id="fruitIcon">🍎</div>
    <p>AI ตรวจพบผลไม้คือ</p>
    <h3 id="bestName">-</h3>
    <div class="percent" id="bestPercent">0%</div>
    <p>ระดับความมั่นใจ</p>
  </div>

  <h2>📊 ผลการจำแนกทั้งหมด</h2>

  <div id="labelContainer"></div>

</div>

<footer>
  💙 Fruity AI - Discover Your Fruit 💙
</footer>

</div>

<script>

// ======================================
// TEACHABLE MACHINE MODEL
// ใช้ไฟล์จากโฟลเดอร์ my_model
// ======================================

const MODEL_URL = "./my_model/";

let model;
let imageURL = null;
let isLoading = false;

const input = document.getElementById("imageInput");
const preview = document.getElementById("preview");
const previewBox = document.getElementById("previewBox");
const analyzeBtn = document.getElementById("analyzeBtn");
const statusText = document.getElementById("status");
const results = document.getElementById("results");
const dropArea = document.getElementById("dropArea");

// ======================================
// LOAD TEACHABLE MACHINE MODEL
// ======================================

async function loadModel() {

  if (model) return true;

  try {

    statusText.textContent = "กำลังโหลด AI Model...";

    const modelURL = MODEL_URL + "model.json";
    const metadataURL = MODEL_URL + "metadata.json";

    model = await tmImage.load(
      modelURL,
      metadataURL
    );

    console.log("Model loaded successfully");

    return true;

  } catch(error) {

    console.error("Model loading error:", error);

    statusText.textContent =
      "โหลดโมเดลไม่สำเร็จ กรุณาตรวจสอบไฟล์ใน my_model";

    return false;
  }
}

// ======================================
// IMAGE UPLOAD
// ======================================

function selectImage(file) {

  if (!file) return;

  if (!file.type.startsWith("image/")) {
    statusText.textContent = "กรุณาเลือกไฟล์รูปภาพ";
    return;
  }

  if (imageURL) {
    URL.revokeObjectURL(imageURL);
  }

  imageURL = URL.createObjectURL(file);

  preview.onload = function() {

    previewBox.style.display = "block";
    analyzeBtn.disabled = false;
    results.style.display = "none";

    document.getElementById("fileName").textContent =
      file.name;

    statusText.textContent =
      "เลือกรูปภาพสำเร็จ พร้อมวิเคราะห์ 💙";
  };

  preview.onerror = function() {

    statusText.textContent =
      "ไม่สามารถเปิดรูปภาพได้";

    analyzeBtn.disabled = true;
  };

  preview.src = imageURL;
}

input.addEventListener("change", function(event) {
  selectImage(event.target.files[0]);
});

// ======================================
// DRAG AND DROP
// ======================================

dropArea.addEventListener("dragover", function(event) {
  event.preventDefault();
  dropArea.classList.add("drag");
});

dropArea.addEventListener("dragleave", function() {
  dropArea.classList.remove("drag");
});

dropArea.addEventListener("drop", function(event) {

  event.preventDefault();
  dropArea.classList.remove("drag");

  selectImage(event.dataTransfer.files[0]);
});

// ======================================
// REMOVE IMAGE
// ======================================

document.getElementById("removeBtn")
.addEventListener("click", function() {

  if (imageURL) {
    URL.revokeObjectURL(imageURL);
  }

  imageURL = null;
  preview.src = "";
  input.value = "";

  previewBox.style.display = "none";
  results.style.display = "none";
  analyzeBtn.disabled = true;

  statusText.textContent =
    "กรุณาเลือกรูปภาพที่ต้องการวิเคราะห์ 💙";
});

// ======================================
// FRUIT EMOJI
// ======================================

function getFruitIcon(name) {

  const n = name.toLowerCase();

  const fruits = {
    apple: "🍎",
    banana: "🍌",
    orange: "🍊",
    grape: "🍇",
    strawberry: "🍓",
    watermelon: "🍉",
    mango: "🥭",
    pineapple: "🍍",
    blueberry: "🫐",
    cherry: "🍒",
    peach: "🍑",
    lemon: "🍋",
    coconut: "🥥",
    pear: "🍐",
    avocado: "🥑",
    "แอปเปิล": "🍎",
    "กล้วย": "🍌",
    "ส้ม": "🍊",
    "องุ่น": "🍇",
    "สตรอว์เบอร์รี": "🍓",
    "แตงโม": "🍉",
    "มะม่วง": "🥭",
    "สับปะรด": "🍍",
    "บลูเบอร์รี": "🫐",
    "เชอร์รี": "🍒",
    "พีช": "🍑"
  };

  for (const key in fruits) {
    if (n.includes(key.toLowerCase())) {
      return fruits[key];
    }
  }

  return "🍉";
}

// ======================================
// PREDICTION
// ใช้ model.predict(image)
// จาก Teachable Machine API
// ======================================

analyzeBtn.addEventListener("click", async function() {

  if (!preview.complete || !preview.naturalWidth) {
    statusText.textContent = "กรุณาเลือกรูปภาพก่อน";
    return;
  }

  if (isLoading) return;

  isLoading = true;
  analyzeBtn.disabled = true;
  results.style.display = "none";

  try {

    const loaded = await loadModel();

    if (!loaded) return;

    statusText.textContent =
      "AI กำลังวิเคราะห์รูปภาพ... ✨";

    // ทำนายจากรูปภาพที่อัปโหลด
    const prediction = await model.predict(preview);

    // เรียงจากความมั่นใจมากไปน้อย
    prediction.sort((a,b) =>
      b.probability - a.probability
    );

    const best = prediction[0];

    // ผลการทำนายอันดับแรก
    document.getElementById("bestName").textContent =
      best.className;

    document.getElementById("bestPercent").textContent =
      (best.probability * 100).toFixed(2) + "%";

    document.getElementById("fruitIcon").textContent =
      getFruitIcon(best.className);

    // แสดงผลทุกคลาส
    const container =
      document.getElementById("labelContainer");

    container.innerHTML = "";

    prediction.forEach(function(item) {

      const percent = item.probability * 100;

      const div = document.createElement("div");
      div.className = "result-item";

      const name = document.createElement("div");
      name.className = "result-name";

      const label = document.createElement("span");
      label.textContent =
        getFruitIcon(item.className) + " " + item.className;

      const value = document.createElement("span");
      value.textContent = percent.toFixed(2) + "%";

      name.append(label,value);

      const bg = document.createElement("div");
      bg.className = "bar-bg";

      const bar = document.createElement("div");
      bar.className = "bar";
      bar.style.width = percent + "%";

      bg.appendChild(bar);
      div.append(name,bg);

      container.appendChild(div);

    });

    results.style.display = "block";

    statusText.textContent =
      "วิเคราะห์สำเร็จแล้ว 💙";

    results.scrollIntoView({
      behavior: "smooth",
      block: "start"
    });

  } catch(error) {

    console.error("Prediction error:", error);

    statusText.textContent =
      "วิเคราะห์ไม่สำเร็จ กรุณาตรวจสอบโมเดล";

  } finally {

    isLoading = false;
    analyzeBtn.disabled = false;

  }

});

</script>

</body>
</html>
